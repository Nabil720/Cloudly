# Picked up by the Grafana that ships with kube-prometheus-stack:
#  - datasources: ConfigMaps labelled grafana_datasource=1 in Grafana's namespace (default)
#  - dashboards:  ConfigMaps labelled grafana_dashboard=1 in any namespace
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasource-loki
  namespace: default
  labels:
    grafana_datasource: "1"
data:
  loki.yaml: |
    apiVersion: 1
    datasources:
      - name: Loki
        uid: loki
        type: loki
        access: proxy
        url: http://loki.monitoring.svc.cluster.local:3100
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-cloudly-backend
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  cloudly-backend.json: |
    {
      "uid": "cloudly-backend",
      "title": "Cloudly - Backend",
      "tags": [
        "cloudly"
      ],
      "timezone": "browser",
      "schemaVersion": 39,
      "refresh": "30s",
      "time": {
        "from": "now-1h",
        "to": "now"
      },
      "templating": {
        "list": [
          {
            "name": "namespace",
            "label": "Environment",
            "type": "query",
            "datasource": {
              "type": "prometheus",
              "uid": "prometheus"
            },
            "query": {
              "query": "label_values(kube_deployment_status_replicas{deployment=\"backend\"}, namespace)",
              "refId": "ns"
            },
            "definition": "label_values(kube_deployment_status_replicas{deployment=\"backend\"}, namespace)",
            "refresh": 2,
            "current": {
              "text": "dev",
              "value": "dev"
            }
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "type": "timeseries",
          "title": "Backend CPU usage (cores)",
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 12,
            "h": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            }
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (pod) (rate(container_cpu_usage_seconds_total{namespace=\"$namespace\", container=\"backend\"}[2m]))",
              "legendFormat": "{{pod}}"
            }
          ]
        },
        {
          "id": 2,
          "type": "timeseries",
          "title": "Backend memory usage",
          "gridPos": {
            "x": 12,
            "y": 0,
            "w": 12,
            "h": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "bytes"
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            }
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (pod) (container_memory_working_set_bytes{namespace=\"$namespace\", container=\"backend\"})",
              "legendFormat": "{{pod}}"
            }
          ]
        },
        {
          "id": 3,
          "type": "timeseries",
          "title": "Request rate (req/s) by status",
          "gridPos": {
            "x": 0,
            "y": 8,
            "w": 12,
            "h": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps"
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            }
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (status) (rate(nginx_ingress_controller_requests{namespace=\"$namespace\", service=\"backend-service\"}[2m]))",
              "legendFormat": "{{status}}"
            }
          ]
        },
        {
          "id": 4,
          "type": "timeseries",
          "title": "Error rate (5xx %)",
          "gridPos": {
            "x": 12,
            "y": 8,
            "w": 12,
            "h": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percent"
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            }
          },
          "targets": [
            {
              "refId": "A",
              "expr": "100 * sum(rate(nginx_ingress_controller_requests{namespace=\"$namespace\", service=\"backend-service\", status=~\"5..\"}[2m])) / clamp_min(sum(rate(nginx_ingress_controller_requests{namespace=\"$namespace\", service=\"backend-service\"}[2m])), 1e-9)",
              "legendFormat": "5xx %"
            },
            {
              "refId": "B",
              "expr": "100 * sum(rate(nginx_ingress_controller_requests{namespace=\"$namespace\", service=\"backend-service\", status=~\"4..\"}[2m])) / clamp_min(sum(rate(nginx_ingress_controller_requests{namespace=\"$namespace\", service=\"backend-service\"}[2m])), 1e-9)",
              "legendFormat": "4xx % (incl. 429 rate-limited)"
            }
          ]
        },
        {
          "id": 5,
          "type": "timeseries",
          "title": "Backend replicas",
          "gridPos": {
            "x": 0,
            "y": 16,
            "w": 12,
            "h": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            }
          },
          "targets": [
            {
              "refId": "A",
              "expr": "kube_deployment_status_replicas_available{namespace=\"$namespace\", deployment=\"backend\"}",
              "legendFormat": "available"
            },
            {
              "refId": "B",
              "expr": "kube_horizontalpodautoscaler_status_desired_replicas{namespace=\"$namespace\", horizontalpodautoscaler=\"backend\"}",
              "legendFormat": "HPA desired"
            }
          ]
        },
        {
          "id": 6,
          "type": "timeseries",
          "title": "Latency p95 (s)",
          "gridPos": {
            "x": 12,
            "y": 16,
            "w": 12,
            "h": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "s"
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            }
          },
          "targets": [
            {
              "refId": "A",
              "expr": "histogram_quantile(0.95, sum by (le) (rate(nginx_ingress_controller_request_duration_seconds_bucket{namespace=\"$namespace\", service=\"backend-service\"}[2m])))",
              "legendFormat": "p95"
            }
          ]
        },
        {
          "id": 7,
          "type": "logs",
          "title": "Backend logs",
          "gridPos": {
            "x": 0,
            "y": 24,
            "w": 24,
            "h": 10
          },
          "datasource": {
            "type": "loki",
            "uid": "loki"
          },
          "options": {
            "showTime": true,
            "wrapLogMessage": true,
            "sortOrder": "Descending"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "{namespace=\"$namespace\", app=\"backend\"}"
            }
          ]
        }
      ]
    }
