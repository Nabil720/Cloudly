# Shared manifests for every environment. Namespace, image tags and
# per-environment differences live in ../overlays/<env>.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - configuration/app-configmap.yaml
  - configuration/app-secrets.yaml
  - storage/postgres-pv.yaml
  - storage/postgres-pvc.yaml
  - postgres/postgres-deployment.yaml
  - postgres/postgres-service.yaml
  - redis/redis-deployment.yaml
  - redis/redis-service.yaml
  - backend/backend-deployment.yaml
  - backend/backend-service.yaml
  - backend/hpa-backend.yaml
  - frontend/frontend-deployment.yaml
  - frontend/frontend-service.yaml
  - ingress/ingress-dev.yaml
