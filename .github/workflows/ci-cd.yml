name: CI

# Builds the images, pushes them to Docker Hub and updates the image tag in
# k8s/overlays/<env>. Argo CD picks up the manifest change and deploys it.
#
#   master / main   -> k8s/overlays/dev
#   pre-release/v*  -> k8s/overlays/preprod
#   release/v*      -> k8s/overlays/release
on:
  push:
    branches: [master, main, "pre-release/v*", "release/v*"]

permissions:
  contents: write # push the manifest update

concurrency:
  group: ci-${{ github.ref }}

jobs:
  build-push-update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set environment and image tag
        run: |
          case "$GITHUB_REF_NAME" in
            master|main)    env=dev ;;
            pre-release/v*) env=preprod ;;
            release/v*)     env=release ;;
          esac
          # release/v1.2.0 -> release-v1.2.0-a1b2c3d
          tag="${GITHUB_REF_NAME//\//-}-${GITHUB_SHA::7}"
          echo "ENV=$env" >> "$GITHUB_ENV"
          echo "TAG=$tag" >> "$GITHUB_ENV"

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/cloudly-backend:${{ env.TAG }}

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/cloudly-frontend:${{ env.TAG }}

      - name: Update image tag in manifest
        run: |
          file="k8s/overlays/$ENV/kustomization.yaml"
          sed -i "s/^\(\s*newTag:\).*/\1 $TAG/" "$file"

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$file"
          # [skip ci] stops this commit from starting another pipeline run.
          git commit -m "ci($ENV): update image tag to $TAG [skip ci]"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
